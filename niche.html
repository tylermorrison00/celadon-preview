    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    /* Niche detail page — loads one niche by ?id= */
    function normTitle(s) { return String(s || '').replace(/[\u{1D400}-\u{1D7FF}]/gu, function(ch) { var cp = ch.codePointAt(0); if (cp >= 0x1D400 && cp <= 0x1D419) return String.fromCharCode(65 + cp - 0x1D400); if (cp >= 0x1D41A && cp <= 0x1D433) return String.fromCharCode(97 + cp - 0x1D41A); if (cp >= 0x1D7CE && cp <= 0x1D7D7) return String.fromCharCode(48 + cp - 0x1D7CE); if (cp >= 0x1D5D4 && cp <= 0x1D5ED) return String.fromCharCode(65 + cp - 0x1D5D4); if (cp >= 0x1D5EE && cp <= 0x1D607) return String.fromCharCode(97 + cp - 0x1D5EE); if (cp >= 0x1D7E2 && cp <= 0x1D7EB) return String.fromCharCode(48 + cp - 0x1D7E2); return ch; }); }
    function tick() { try { if (window.matchMedia('(hover: hover)').matches) press(); } catch (e) {} }
    function press() {
        try {
            var AC = window.AudioContext || window.webkitAudioContext;
            var ctx = new AC();
            var t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(520, t);
            o.frequency.exponentialRampToValueAtTime(390, t + 0.13);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.36, t + 0.012);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
            o.connect(g); g.connect(ctx.destination);
            o.start(t); o.stop(t + 0.2);
        } catch (e) {}
    }
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.btn').forEach(function(b) { b.addEventListener('mouseenter', tick); });
    });
    (function() {
        var box = document.getElementById('nicheDetail');
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        var tagColors = ['#7CCFB0','#A8C5E8','#E8734A','#F0C980','#8FD6C8','#B8A9E8','#E8A0A0','#A0D6E8'];
        function tagDotColor(i) {
            var hue = (i * 137.508) % 360;
            var sat = 55 + (i % 3) * 10;
            var light = 68 + (i % 4) * 4;
            return 'hsl(' + Math.round(hue) + ',' + sat + '%,' + light + '%)';
        }
        function tagColor(t) {
            try {
                var cmap = JSON.parse(localStorage.getItem('ca_niches_tagcolors') || '{}');
                var c = cmap[String(t).toLowerCase()];
                if (c) return c;
            } catch (e) {}
            var h = 0;
            var s = String(t).toLowerCase();
            for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 997;
            return tagDotColor(h % 360);
        }
        function titleCase(s) {
            return String(s == null ? '' : s).replace(/\w\S*/g, function(w) {
                return w.charAt(0).toUpperCase() + w.slice(1);
            });
        }
        async function init() {
            var id = new URLSearchParams(location.search).get('id');
            if (!id) { box.innerHTML = '<div class="pempty">No niche selected.</div>'; return; }
            if (!window.supabase || !window.supabase.createClient) {
                box.innerHTML = '<div class="pempty">Could not load. Check your connection and refresh.</div>';
                return;
            }
            var sb = window.supabase.createClient(
                'https://vfyuebkdkxhdrlduqxng.supabase.co',
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmeXVlYmtka3hoZHJsZHVxeG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTI1NDQsImV4cCI6MjEwNjc2ODU0NH0.RY-VU33zwySGKmPH34pHs72HaxRt9yi4lAhHO9xn7_4'
            );
            try {
                var res = await sb.from('niches').select('*').eq('id', id).single();
                if (res.error || !res.data) throw res.error || new Error('not found');
                var p = res.data;
                var tags = (p.tags || []).map(function(t) { return '<span class="ptag-lg"><span class="dot" style="background:' + tagColor(t) + ';width:8px;height:8px;border-radius:3px;display:inline-block;"></span>' + esc(titleCase(t)) + '</span>'; }).join('');
                var plan = 'free', isAdm = false;
                try {
                    var _caRaw = localStorage.getItem('ca_auth_state');
                    if (_caRaw) {
                        var _ca = JSON.parse(_caRaw);
                        if (_ca && _ca.ts && (Date.now() - _ca.ts < 30 * 60 * 1000) && _ca.userId) {
                            isAdm = !!_ca.isAdmin; plan = String(_ca.userPlan || 'free').toLowerCase();
                        }
                    }
                } catch (e0) {}
                // Validate in background, update if changed
                (async function() {
                    try {
                        var sess0 = await sb.auth.getSession();
                        var p2 = 'free', a2 = false;
                        if (sess0.data && sess0.data.session) {
                            var pr0 = await sb.from('profiles').select('is_admin,plan').eq('id', sess0.data.session.user.id).single();
                            if (pr0.data) { a2 = !!pr0.data.is_admin; p2 = String(pr0.data.plan || 'free').toLowerCase(); }
                        }
                        if (a2 !== isAdm || p2 !== plan) { location.reload(); }
                    } catch (e1) {}
                })();
                var hasAccess = isAdm || plan === 'pro';
                var locked = false;
                if (p.is_pro && !hasAccess) {
                    if (plan === 'basic') {
                        var dp = Math.floor((Date.now() - new Date(p.created_at).getTime()) / 86400000);
                        if (14 - dp > 0) locked = true; else hasAccess = true;
                    } else locked = true;
                } else if (p.is_basic && !hasAccess) {
                    if (plan === 'basic') hasAccess = true;
                    else locked = true;
                }
                var img = ''; // Thumbnail not shown on detail page, only gallery
                // Detail gallery images - horizontal scroll with arrows (arrows only when scrollable)
                var gallery = '';
                if (p.extra_images && Array.isArray(p.extra_images) && p.extra_images.length && !locked) {
                    gallery = '<div class="gal-wrap" style="position:relative;margin:20px 0;">' +
                        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
                        '<button class="gal-arrow gal-prev" style="display:none;width:38px;height:38px;border-radius:50%;border:none;background:linear-gradient(180deg,#FEFEFF 0%,#F5F8FD 46%,#E9EFFA 46.01%,#DEE7F6 100%);box-shadow:0 2px 8px rgba(0,0,0,.12),inset 0 1px 0 0 rgba(255,255,255,.8);cursor:pointer;font-size:20px;color:#0E3A2E;font-weight:700;">‹</button>' +
                        '<span></span>' +
                        '<button class="gal-arrow gal-next" style="display:none;width:38px;height:38px;border-radius:50%;border:none;background:linear-gradient(180deg,#FEFEFF 0%,#F5F8FD 46%,#E9EFFA 46.01%,#DEE7F6 100%);box-shadow:0 2px 8px rgba(0,0,0,.12),inset 0 1px 0 0 rgba(255,255,255,.8);cursor:pointer;font-size:20px;color:#0E3A2E;font-weight:700;">›</button>' +
                        '</div>' +
                        '<div class="gal-scroll" style="display:flex;gap:12px;overflow-x:auto;scroll-behavior:smooth;padding:4px 2px;scrollbar-width:none;">' +
                        p.extra_images.slice(0, 10).map(function(u) { return '<img src="' + esc(u) + '" style="width:150px;flex:0 0 auto;height:auto;object-fit:contain;border-radius:12px;" loading="lazy">'; }).join('') +
                        '</div>' +
                        '</div>';
                }
                var bodyHtml = '';
                if (locked) {
                    bodyHtml = '<div class="pempty">This is a Pro niche.<br><a class="btn solid" href="niches.html" style="margin-top:14px;display:inline-block;">Unlock Membership</a></div>';
                } else {
                    if (gallery) bodyHtml += gallery;
                    if (p.why_text) bodyHtml += '<h3 style="color:#0E3A2E;margin:22px 0 8px;">Why it works</h3><div class="pbox">' + esc(p.why_text) + '</div>';
                    if (p.detail_text) bodyHtml += '<h3 style="color:#0E3A2E;margin:22px 0 8px;">What\'s inside</h3><div class="pbox">' + esc(p.detail_text) + '</div>';
                    if (p.how_to_use) bodyHtml += '<h3 style="color:#0E3A2E;margin:22px 0 8px;">How to use</h3><div class="pbox">' + esc(p.how_to_use) + '</div>';
                    if (p.link_url || p.prompt_link) { var linkLabel = 'Open Link'; var lu = String(p.link_url || '').toLowerCase(); if (lu.indexOf('tiktok.com') > -1) linkLabel = 'Open account'; else if (lu.indexOf('youtube.com') > -1 || lu.indexOf('youtu.be') > -1) linkLabel = 'Open channel'; else if (lu.indexOf('instagram.com') > -1) linkLabel = 'Open page'; else if (lu.indexOf('facebook.com') > -1 || lu.indexOf('fb.com') > -1) linkLabel = 'Open page'; bodyHtml += '<div class="copybar">' + (p.link_url ? '<a class="btn solid" href="' + esc(p.link_url) + '" target="_blank" rel="noopener" style="font-size:1rem;padding:14px 34px;" onclick="press()">' + linkLabel + '</a>' : '') + (p.prompt_link ? '<a class="btn solid" href="' + esc(p.prompt_link) + '" target="_blank" rel="noopener" style="font-size:1rem;padding:14px 34px;" onclick="press()">Get prompt</a>' : '') + '</div>'; }
                }
                box.innerHTML =
                    '<h1 class="ptitle-lg">' + esc(normTitle(p.title)) + '</h1>' +

                    img +
                    (tags ? '<div class="ptags-lg">' + tags + '</div>' : '') +
                    bodyHtml;
                document.title = (p.title || 'Niche') + ' — Creators Automation';
                // Gallery arrows: show only when scrollable, scroll on click
                (function initGallery() {
                    var wrap = document.querySelector('.gal-wrap');
                    if (!wrap) return;
                    var sc = wrap.querySelector('.gal-scroll');
                    var prev = wrap.querySelector('.gal-prev');
                    var next = wrap.querySelector('.gal-next');
                    var arrowRow = prev.parentElement;
                    function updateArrows() {
                        var canScroll = sc.scrollWidth > sc.clientWidth + 4;
                        prev.style.display = canScroll ? 'block' : 'none';
                        next.style.display = canScroll ? 'block' : 'none';
                        arrowRow.style.display = canScroll ? 'flex' : 'none';
                        sc.style.justifyContent = canScroll ? 'flex-start' : 'center';
                    }
                    prev.addEventListener('click', function() { sc.scrollBy({ left: -320, behavior: 'smooth' }); });
                    next.addEventListener('click', function() { sc.scrollBy({ left: 320, behavior: 'smooth' }); });
                    updateArrows();
                    window.addEventListener('resize', updateArrows);
                    setTimeout(updateArrows, 500);
                })();
                // auth-aware nav (login/logout only)
                try {
                    var s = await sb.auth.getSession();
                    var navAuth = document.getElementById('navAuth');
                    var drawerAuth = document.getElementById('drawerAuth');
                    if (navAuth && s.data.session) {
                        navAuth.style.display = 'none';
                        if (drawerAuth) {
                            drawerAuth.innerHTML = '<button class="btn solid" type="button" id="drawerLogout" style="width:100%;text-align:center;">Logout</button>';
                            document.getElementById('drawerLogout').addEventListener('click', async function() {
                                await sb.auth.signOut(); location.reload();
                            });
                        }
                    }
                } catch (e) {}
            } catch (err) {
                box.innerHTML = '<div class="pempty">Niche not found.</div>';
            }
        }
        init();
    })();
    </script>
