<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account - Creators Automation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&family=Albert+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="templatemo-633-celadon-style.css">
    <style>
        .signup-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .signup-wrap .close-plate { max-width: 720px; width: 100%; }
        .signup-wrap .form { flex-direction: column; align-items: stretch; max-width: 420px; margin: 0 auto; }
        .signup-wrap .field { width: 100%; }
        .switch.auth-wide { width: 100%; max-width: 210px; height: 22px; margin: 4px auto 18px; display: flex; align-items: center; justify-content: center; background: #ffffff; }
        .switch.auth-wide .knob { width: 46px; height: 16px; top: 3px; left: 3px; transition: left .34s var(--ease), transform .34s var(--ease), background .34s linear, box-shadow .34s; }
        .switch.auth-wide[aria-checked="true"] { background: var(--gloss-jade); }
        .switch.auth-wide[aria-checked="true"] .knob { left: calc(100% - 49px); transform: none; }
        .auth-toggle-text { font-weight: 600; font-size: .8rem; color: #111; pointer-events: none; }
        .switch.auth-wide[aria-checked="true"] .auth-toggle-text { color: #0E3A2E; }
        .btn.google { background-color: #ffffff; color: #1f2937; border: 1px solid #dfe6f2; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
        .auth-err { display: none; color: #b3261e; font-size: .85rem; margin: 0 auto 12px; max-width: 420px; text-align: center; }
        .auth-err.show { display: block; }
        .logged-panel { display: none; max-width: 420px; margin: 0 auto; text-align: center; }
        .logged-panel.show { display: block; }
        .logged-panel p { margin: 0 0 18px; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="signup-wrap">
        <div class="close-plate">
            <span class="eyebrow">Get started</span>
            <div id="authBox">
                <div class="switch auth-wide" id="authSwitch" role="switch" tabindex="0" aria-checked="false" aria-label="Switch between sign up and sign in">
                    <span class="knob"></span>
                    <span class="auth-toggle-text" id="authToggleText">Sign up</span>
                </div>
                <p class="auth-err" id="authErr"></p>
                <div class="form">
                    <input class="field" type="email" id="authEmail" placeholder="Email" aria-label="Email" autocomplete="email">
                    <input class="field" type="password" id="authPass" placeholder="Password" aria-label="Password" autocomplete="current-password">
                    <button class="btn solid" type="button" id="authAction">Create account</button>
                    <button class="btn google" type="button" id="googleBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        Continue with Google
                    </button>
                </div>
            </div>
            <div class="logged-panel" id="loggedPanel">
                <p>Logged in as <b id="loggedEmail"></b></p>
                <button class="btn solid" type="button" id="logoutBtn">Logout</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        var Snd = (function() {
            var ctx = null;
            function ac() {
                var AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                if (!ctx) { try { ctx = new AC(); } catch (e) { return null; } }
                if (ctx.state === 'suspended') ctx.resume();
                return ctx;
            }
            function tone(f1, f2, d, g) {
                var c = ac(); if (!c) return;
                var t = c.currentTime;
                var o = c.createOscillator(), gn = c.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(f1, t);
                o.frequency.exponentialRampToValueAtTime(f2, t + d);
                gn.gain.setValueAtTime(0.0001, t);
                gn.gain.exponentialRampToValueAtTime(g * 2.6, t + 0.012);
                gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
                o.connect(gn); gn.connect(c.destination);
                o.start(t); o.stop(t + d + 0.05);
            }
            return {
                sw: function(on) { tone(on ? 500 : 700, on ? 700 : 500, 0.12, 0.12); },
                press: function() { tone(520, 390, 0.13, 0.14); }
            };
        })();
        var sb = window.supabase.createClient(
            'https://vfyuebkdkxhdrlduqxng.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmeXVlYmtka3hoZHJsZHVxeG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTI1NDQsImV4cCI6MjEwNjc2ODU0NH0.RY-VU33zwySGKmPH34pHs72HaxRt9yi4lAhHO9xn7_4'
        );
        (function() {
            var sw = document.getElementById('authSwitch');
            var label = document.getElementById('authToggleText');
            var action = document.getElementById('authAction');
            var google = document.getElementById('googleBtn');
            var emailEl = document.getElementById('authEmail');
            var passEl = document.getElementById('authPass');
            var errEl = document.getElementById('authErr');
            var authBox = document.getElementById('authBox');
            var loggedPanel = document.getElementById('loggedPanel');
            var loggedEmail = document.getElementById('loggedEmail');
            var logoutBtn = document.getElementById('logoutBtn');
            if (!sw || !label || !action) return;
            function showErr(msg) {
                errEl.textContent = msg || '';
                errEl.classList.toggle('show', !!msg);
            }
            function setMode(signin) {
                sw.setAttribute('aria-checked', signin ? 'true' : 'false');
                label.textContent = signin ? 'Sign in' : 'Sign up';
                action.textContent = signin ? 'Login' : 'Create account';
                showErr('');
            }
            function setLoggedIn(email) {
                if (email) {
                    loggedEmail.textContent = email;
                    authBox.style.display = 'none';
                    loggedPanel.classList.add('show');
                } else {
                    authBox.style.display = '';
                    loggedPanel.classList.remove('show');
                }
            }
            function flip() {
                var signin = sw.getAttribute('aria-checked') !== 'true';
                setMode(signin);
                Snd.sw(signin);
            }
            sw.addEventListener('click', flip);
            sw.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
            });
            action.addEventListener('click', async function() {
                Snd.press();
                var email = (emailEl.value || '').trim();
                var password = passEl.value || '';
                if (!email || !password) { showErr('Email aur password dono likho.'); return; }
                showErr('');
                action.disabled = true;
                try {
                    var signin = sw.getAttribute('aria-checked') === 'true';
                    var res = signin
                        ? await sb.auth.signInWithPassword({ email: email, password: password })
                        : await sb.auth.signUp({ email: email, password: password });
                    if (res.error) { showErr(res.error.message); return; }
                    setLoggedIn(res.data.user && res.data.user.email);
                } catch (e) {
                    showErr('Kuch ghalat hua — dobara try karo.');
                } finally {
                    action.disabled = false;
                }
            });
            if (google) google.addEventListener('click', async function() {
                Snd.press();
                showErr('');
                try {
                    var res = await sb.auth.signInWithOAuth({
                        provider: 'google',
                        options: { redirectTo: 'https://celadon-preview.vercel.app/signup.html' }
                    });
                    if (res.error) showErr(res.error.message);
                } catch (e) {
                    showErr('Google login abhi setup nahi hua.');
                }
            });
            logoutBtn.addEventListener('click', async function() {
                Snd.press();
                await sb.auth.signOut();
                setLoggedIn(null);
                passEl.value = '';
            });
            sb.auth.getSession().then(function(res) {
                var s = res.data && res.data.session;
                if (s && s.user) setLoggedIn(s.user.email);
            });
            sb.auth.onAuthStateChange(function(evt, session) {
                if (evt === 'SIGNED_IN' && session && session.user) setLoggedIn(session.user.email);
                if (evt === 'SIGNED_OUT') setLoggedIn(null);
            });
        })();
    </script>
</body>
</html>
