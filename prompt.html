    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    (function() {
        var box = document.getElementById('promptDetail');
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        async function init() {
            var id = new URLSearchParams(location.search).get('id');
            if (!id) { box.innerHTML = '<div class="pempty">No prompt selected.</div>'; return; }
            if (!window.supabase || !window.supabase.createClient) {
                box.innerHTML = '<div class="pempty">Could not load. Check your connection and refresh.</div>';
                return;
            }
            var sb = window.supabase.createClient(
                'https://vfyuebkdkxhdrlduqxng.supabase.co',
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmeXVlYmtka3hoZHJsZHVxeG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTI1NDQsImV4cCI6MjEwNjc2ODU0NH0.RY-VU33zwySGKmPH34pHs72HaxRt9yi4lAhHO9xn7_4'
            );
            try {
                var res = await sb.from('prompts').select('*').eq('id', id).single();
                if (res.error || !res.data) throw res.error || new Error('not found');
                var p = res.data;
                var tags = (p.tags || []).map(function(t) { return '<span class="ptag-lg">' + esc(t) + '</span>'; }).join('');
                var img = p.media_url ? '<img class="pimg-lg" src="' + esc(p.media_url) + '" alt="">' : '';
                var pro = p.is_pro ? '<span class="probadge">PRO</span>' : '';
                box.innerHTML =
                    '<h1 class="ptitle-lg">' + esc(p.title || 'Untitled') + '</h1>' +
                    '<div class="pmeta"><span class="catbadge">' + esc(p.category || 'prompt') + '</span>' + pro + '</div>' +
                    img +
                    (tags ? '<div class="ptags-lg">' + tags + '</div>' : '') +
                    '<div class="copybar"><button class="btn solid" id="copyBtn" style="font-size:1rem;padding:14px 34px;">Copy prompt</button></div>' +
                    '<div class="pbox" id="promptText">' + esc(p.prompt_text || '') + '</div>';
                document.title = (p.title || 'Prompt') + ' — Creators Automation';
                document.getElementById('copyBtn').addEventListener('click', async function() {
                    var btn = this;
                    try { await navigator.clipboard.writeText(p.prompt_text || ''); btn.textContent = 'Copied!'; }
                    catch (err) {
                        var ta = document.createElement('textarea');
                        ta.value = p.prompt_text || '';
                        document.body.appendChild(ta); ta.select();
                        try { document.execCommand('copy'); btn.textContent = 'Copied!'; } catch (e2) { btn.textContent = 'Copy failed'; }
                        document.body.removeChild(ta);
                    }
                    setTimeout(function() { btn.textContent = 'Copy prompt'; }, 1500);
                });
                try {
                    var s = await sb.auth.getSession();
                    var navAuth = document.getElementById('navAuth');
                    var drawerAuth = document.getElementById('drawerAuth');
                    if (navAuth && s.data.session) {
                        navAuth.style.display = 'none';
                        if (drawerAuth) {
                            drawerAuth.innerHTML = '<button class="btn solid" type="button" id="drawerLogout" style="width:100%;text-align:center;">Logout</button>';
                            document.getElementById('drawerLogout').addEventListener('click', async function() {
                                await sb.auth.signOut(); location.reload();
                            });
                        }
                    }
                } catch (e) {}
            } catch (err) {
                box.innerHTML = '<div class="pempty">Prompt not found.</div>';
            }
        }
        init();
    })();
    </script>
