    <script>
    /* Creators Automation — prompt vault (Supabase) + auth-aware nav + admin CRUD */
    (function() {
        var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmeXVlYmtka3hoZHJsZHVxeG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTI1NDQsImV4cCI6MjEwNjc2ODU0NH0.RY-VU33zwySGKmPH34pHs72HaxRt9yi4lAhHO9xn7_4';
        var API = 'https://vfyuebkdkxhdrlduqxng.supabase.co';
        var sb = null;
        /* detect mobile browser in desktop-site mode */
        try { if (window.innerWidth > (window.screen.width || 0) * 1.3) document.body.classList.add('mobdesk'); } catch (e) {}
        var grid = document.getElementById('promptCards');
        if (!grid) return;
        function getSession() {
            try {
                var raw = localStorage.getItem('sb-vfyuebkdkxhdrlduqxng-auth-token');
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }
        function loadSupabaseJs(cb) {
            if (window.supabase && window.supabase.createClient) return cb();
            var s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
            s.onload = cb;
            s.onerror = function() {
                var s2 = document.createElement('script');
                s2.src = 'https://unpkg.com/@supabase/supabase-js@2';
                s2.onload = cb;
                document.head.appendChild(s2);
            };
            document.head.appendChild(s);
        }
        var pag = document.getElementById('pagination');
        var adminBar = document.getElementById('adminBar');
        var navAuth = document.getElementById('navAuth');
        var searchInput = document.getElementById('promptSearch');
        var searchBtn = document.getElementById('searchBtn');

        var isMobDesk = false; try { isMobDesk = window.innerWidth > (window.screen.width || 0) * 1.3; } catch (e) {}
        var state = { prompts: [], q: '', tag: '', proFilter: null, favOnly: false, platform: '', page: 1, perPage: (isMobDesk ? 16 : (window.innerWidth < 768 ? 8 : 15)), user: null, isAdmin: false, editingId: null };

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        var _favsCache = null;
        function getFavs() {
            if (_favsCache) return _favsCache;
            try { _favsCache = JSON.parse(localStorage.getItem('ca_favs') || '[]'); }
            catch (e) { _favsCache = []; }
            return _favsCache;
        }
        function isFav(id) { return getFavs().indexOf(String(id)) >= 0; }
        function toggleFav(id) {
            var f = getFavs(); var sid = String(id);
            var i = f.indexOf(sid);
            if (i >= 0) f.splice(i, 1); else f.push(sid);
            _favsCache = f;
            try { localStorage.setItem('ca_favs', JSON.stringify(f)); } catch (e) {}
        }
        function titleCase(s) {
            return String(s == null ? '' : s).replace(/\w\S*/g, function(w) {
                return w.charAt(0).toUpperCase() + w.slice(1);
            });
        }
        function tick() {
            try {
                var AC = window.AudioContext || window.webkitAudioContext;
                var ctx = new AC();
                var t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(587, t);
                o.frequency.exponentialRampToValueAtTime(563, t + 0.12);
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(0.15, t + 0.018);
                g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
                o.connect(g); g.connect(ctx.destination);
                o.start(t); o.stop(t + 0.2);
            } catch (e) {}
        }
        function press() {
            try {
                var AC = window.AudioContext || window.webkitAudioContext;
                var ctx = new AC();
                var t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(520, t);
                o.frequency.exponentialRampToValueAtTime(390, t + 0.13);
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(0.36, t + 0.012);
                g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
                o.connect(g); g.connect(ctx.destination);
                o.start(t); o.stop(t + 0.2);
            } catch (e) {}
        }

        var PROMPTS_CACHE_KEY = 'ca_tools_cache';
        var PROMPTS_CACHE_TTL = 5 * 60 * 1000; // 5 minutes
        function getCachedPrompts() {
            try {
                var raw = localStorage.getItem(PROMPTS_CACHE_KEY);
                if (!raw) return null;
                var c = JSON.parse(raw);
                if (!c || !c.data || !c.ts) return null;
                if (Date.now() - c.ts > PROMPTS_CACHE_TTL) return null;
                return c.data;
            } catch (e) { return null; }
        }
        function setCachedPrompts(data) {
            try { localStorage.setItem(PROMPTS_CACHE_KEY, JSON.stringify({ ts: Date.now(), data: data })); } catch (e) {}
        }
        async function fetchPrompts() {
            var res = await fetch(API + '/rest/v1/tools?select=id,name,category,description,url,tags,is_paid,sort_order,created_at&order=sort_order.asc&limit=200', {
                headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON }
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return await res.json() || [];
        }
        async function loadPrompts() {
            // show cached immediately for instant render
            var cached = getCachedPrompts();
            if (cached && cached.length) {
                state.prompts = cached;
                renderTagPills();
                render();
            }
            try {
                var fresh = await fetchPrompts();
                setCachedPrompts(fresh);
                // only re-render if data changed
                if (JSON.stringify(fresh) !== JSON.stringify(state.prompts)) {
                    state.prompts = fresh;
                    renderTagPills();
                    render();
                }
            } catch (err) {
                if (!state.prompts.length) {
                    grid.innerHTML = '<div class="pempty">Tools load nahi ho rahe. Internet check karo aur refresh karo.</div>';
                }
            }
        }
        function initAuth() {
            loadSupabaseJs(function() {
                if (!window.supabase || !window.supabase.createClient) { renderNav(); return; }
                sb = window.supabase.createClient(API, ANON);
                sb.auth.onAuthStateChange(function() { refreshAuth(); });
                refreshAuth();
            });
        }

        function filtered() {
            var q = state.q.trim().toLowerCase();
            var favs = state.favOnly ? getFavs() : null;
            return state.prompts.filter(function(p) {
                if (state.favOnly && favs.indexOf(String(p.id)) < 0) return false;
                if (state.proFilter === 'free' && p.is_paid) return false;
                if (state.proFilter === 'premium' && !p.is_paid) return false;
                if (state.tag && !(p.tags || []).some(function(t) { return String(t).toLowerCase() === state.tag; })) return false;
                if (q && (String(p.name || '') + ' ' + String(p.description || '') + ' ' + (p.tags || []).join(' ')).toLowerCase().indexOf(q) < 0) return false;
                return true;
            });
        }

        function normTitle(s) { return String(s || '').replace(/[\u{1D400}-\u{1D7FF}]/gu, function(ch) { var cp = ch.codePointAt(0); if (cp >= 0x1D400 && cp <= 0x1D419) return String.fromCharCode(65 + cp - 0x1D400); if (cp >= 0x1D41A && cp <= 0x1D433) return String.fromCharCode(97 + cp - 0x1D41A); if (cp >= 0x1D7CE && cp <= 0x1D7D7) return String.fromCharCode(48 + cp - 0x1D7CE); if (cp >= 0x1D5D4 && cp <= 0x1D5ED) return String.fromCharCode(65 + cp - 0x1D5D4); if (cp >= 0x1D5EE && cp <= 0x1D607) return String.fromCharCode(97 + cp - 0x1D5EE); if (cp >= 0x1D7E2 && cp <= 0x1D7EB) return String.fromCharCode(48 + cp - 0x1D7E2); return ch; }); }
        function cardHTML(p) {
            var tags = (p.tags || []).map(function(t, i) {
                var c = tagColors[i % tagColors.length];
                return '<span class="tag-pill tag-sm"><span class="dot" style="background:' + c + ';"></span>' + esc(titleCase(t)) + '</span>';
            }).join('');
            var paidBadge = p.is_paid
                ? '<span class="tag-pill tag-sm"><span class="dot" style="background:#E8A0A0;"></span>Paid</span>'
                : '<span class="tag-pill tag-sm"><span class="dot" style="background:#7DE3A8;"></span>Free</span>';
            var adminBtns = state.isAdmin
                ? '<button class="btn" data-edit="' + p.id + '">Edit</button><button class="btn danger" data-del="' + p.id + '">Delete</button>'
                : '';
            var visitBtn = p.url
                ? '<a class="btn solid" href="' + esc(p.url) + '" target="_blank" rel="noopener" style="flex:1;text-align:center;padding:12px 20px;" onclick="press()">Visit Tool</a>'
                : '';
            var favBtn = state.isAdmin ? '' : '<button class="btn favbtn' + (isFav(p.id) ? ' active' : '') + '" data-fav="' + p.id + '" title="Favorite">' + (isFav(p.id) ? '★' : '☆') + '</button>';
            return '<article class="quote" style="position:relative;padding-top:52px;">' +
                '<div style="position:absolute;top:14px;left:14px;">' + paidBadge + '</div>' +
                (tags ? '<div style="position:absolute;top:14px;right:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60%;">' + tags + '</div>' : '') +
                '<div class="ptitle" style="font-size:1.35rem;font-weight:800;">' + esc(normTitle(p.name) || 'Untitled') + '</div>' +
                (p.description ? '<div class="pdesc" style="margin:10px 0;color:#4a5a55;font-size:.95rem;line-height:1.5;">' + esc(p.description) + '</div>' : '') +
                '<div class="pactions" style="justify-content:center;">' + visitBtn + favBtn + adminBtns + '</div>' +
                '</article>';
        }

        function render() {
            var list = filtered();
            var pages = Math.max(1, Math.ceil(list.length / state.perPage));
            if (state.page > pages) state.page = pages;
            var slice = list.slice((state.page - 1) * state.perPage, state.page * state.perPage);
            grid.innerHTML = slice.length ? slice.map(cardHTML).join('') : '<div class="pempty">No tools yet.</div>';
            var btns = '';
            for (var i = 1; i <= pages; i++) {
                btns += '<button class="page-btn' + (i === state.page ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
            }
            pag.innerHTML = btns;
        }

        grid.addEventListener('click', async function(e) {
            var t = e.target;
            var fv = t.getAttribute('data-fav');
            var ed = t.getAttribute('data-edit');
            var del = t.getAttribute('data-del');
            if (fv) {
                if (!state.user && !state.isAdmin) { try { localStorage.setItem('ca_pending_fav', String(fv)); } catch (e) {} location.href = 'signup.html?next=tools.html'; return; }
                toggleFav(fv);
                var favd = isFav(fv);
                t.textContent = favd ? '★' : '☆';
                t.classList.toggle('active', favd);
                if (state.favOnly) render();
                return;
            }
            if (ed) { location.href = 'prompt-form.html?table=tools&id=' + encodeURIComponent(ed); return; }
            if (del) {
                if (!confirm('Delete this tool?')) return;
                var r = await sb.from('tools').delete().eq('id', del);
                if (!r.error) { try { localStorage.removeItem(PROMPTS_CACHE_KEY); } catch (e) {} state.prompts = []; loadPrompts(); }
                return;
            }
        });

        pag.addEventListener('click', function(e) {
            var pg = e.target.getAttribute('data-page');
            if (pg) { press(); state.page = parseInt(pg, 10); render(); grid.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        });

        function doSearch() {
            state.q = searchInput ? searchInput.value : '';
            state.page = 1;
            render();
        }
        if (searchBtn) searchBtn.addEventListener('click', function() { press(); doSearch(); });
        if (searchInput) searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') doSearch(); });
        var tagColors = ['#7CCFB0','#A8C5E8','#E8734A','#F0C980','#8FD6C8','#B8A9E8','#E8A0A0','#A0D6E8'];
        function renderTagPills() {
            var tf = document.getElementById('tagFilters');
            if (!tf) return;
            var counts = {};
            state.prompts.forEach(function(p) {
                if (state.platform && String(p.category || '').toLowerCase() !== state.platform) return;
                (p.tags || []).forEach(function(t) {
                    counts[t] = (counts[t] || 0) + 1;
                });
            });
            var tags = Object.keys(counts).sort(function(a, b) { return counts[b] - counts[a]; }).slice(0, 12);
            var special = [
                '<button class="tag-pill" data-special="all"><span class="dot" style="background:#0E3A2E;"></span>All Tools</button>',
                '<button class="tag-pill" data-special="free"><span class="dot" style="background:#7DE3A8;"></span>Free</button>',
                '<button class="tag-pill" data-special="premium"><span class="dot" style="background:#E8A0A0;"></span>Premium</button>',
                '<button class="tag-pill" data-special="fav"><span class="dot" style="background:#F0C980;"></span>Favorite</button>'
            ];
            var tagPills = tags.map(function(t, i) {
                var c = tagColors[i % tagColors.length];
                return '<button class="tag-pill" data-tag="' + esc(t) + '"><span class="dot" style="background:' + c + ';"></span>' + esc(titleCase(t)) + '</button>';
            });
            tf.innerHTML = special.join('') + tagPills.join('');
            markActivePill();
        }
        function markActivePill() {
            document.querySelectorAll('#tagFilters .tag-pill').forEach(function(b) {
                var sp = b.getAttribute('data-special');
                var tg = b.getAttribute('data-tag');
                var active = false;
                if (sp === 'all') active = !state.tag && !state.proFilter && !state.favOnly;
                else if (sp === 'free') active = state.proFilter === 'free';
                else if (sp === 'premium') active = state.proFilter === 'premium';
                else if (sp === 'fav') active = state.favOnly;
                else if (tg) active = state.tag === tg;
                b.classList.toggle('active', active);
            });
        }
        document.getElementById('tagFilters').addEventListener('click', function(e) {
            var btn = e.target.closest('.tag-pill');
            if (!btn) return;
            var sp = btn.getAttribute('data-special');
            var tag = btn.getAttribute('data-tag');
            state.tag = ''; state.proFilter = null; state.favOnly = false;
            if (sp === 'free') state.proFilter = 'free';
            else if (sp === 'premium') state.proFilter = 'premium';
            else if (sp === 'fav') state.favOnly = true;
            else if (tag) state.tag = tag;
            state.page = 1;
            markActivePill();
            render();
        });
        /* vault switcher dropdown */
        (function() {
            var vd = document.getElementById('vaultDrop');
            var vb = document.getElementById('vaultBtn');
            var vl = document.getElementById('vaultList');
            if (!vd || !vb || !vl) return;
            var isTouch = false;
            try { isTouch = window.matchMedia('(hover: none)').matches; } catch (e) {}
            function closeVault() { vl.hidden = true; vb.setAttribute('aria-expanded', 'false'); }
            vb.addEventListener('click', function(e) {
                e.stopPropagation(); press();
                var open = vl.hidden;
                closeVault();
                if (open) { vl.hidden = false; vb.setAttribute('aria-expanded', 'true'); }
            });
            if (!isTouch) vb.addEventListener('mouseenter', function() { tick(); });
            vl.querySelectorAll('.vault-opt').forEach(function(o) {
                if (!isTouch) o.addEventListener('mouseenter', function() { tick(); });
                o.addEventListener('click', function() { press(); });
            });
            document.addEventListener('click', function(e) { if (!vd.contains(e.target)) closeVault(); });
            document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeVault(); });
            /* mark current vault */
            var path = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
            vl.querySelectorAll('.vault-opt').forEach(function(o) {
                var href = o.getAttribute('href');
                if ((path === '' || path === 'index.html') && href === 'index.html') o.classList.add('cur');
                else if (path === href) o.classList.add('cur');
            });
        })();

        /* ---- modal ---- */
        var scrim = document.getElementById('promptScrim');
        var mTitle = document.getElementById('promptModalTitle');
        var fTitle = document.getElementById('pfTitle');
        var fCat = document.getElementById('pfCategory');
        var fText = document.getElementById('pfText');
        var fTags = document.getElementById('pfTags');
        var fMedia = document.getElementById('pfMedia');
        var fPro = document.getElementById('pfPro');
        var fErr = document.getElementById('pfErr');

        function openModal(id) {
            state.editingId = id || null;
            mTitle.textContent = id ? 'Edit tool' : 'Add new tool';
            fErr.style.display = 'none';
            if (id) {
                var p = state.prompts.find(function(x) { return String(x.id) === id; });
                if (p) {
                    fTitle.value = p.name || '';
                    fCat.value = p.category || '';
                    fText.value = p.description || '';
                    fTags.value = (p.tags || []).join(', ');
                    fMedia.value = p.url || '';
                    fPro.checked = !!p.is_paid;
                }
            } else {
                fTitle.value = ''; fCat.value = ''; fText.value = '';
                fTags.value = ''; fMedia.value = ''; fPro.checked = false;
            }
            scrim.classList.add('show');
        }
        function closeModal() { scrim.classList.remove('show'); state.editingId = null; }

        document.getElementById('pfCancel').addEventListener('click', closeModal);
        scrim.addEventListener('click', function(e) { if (e.target === scrim) closeModal(); });
        document.getElementById('pfSave').addEventListener('click', async function() {
            press();
            var title = fTitle.value.trim();
            var text = fText.value.trim();
            var toolUrl = fMedia.value.trim();
            if (!title || !toolUrl) {
                fErr.textContent = 'Tool name and URL are required.';
                fErr.style.display = 'block';
                return;
            }
            var row = {
                name: title,
                category: fCat.value.trim() || null,
                description: text || null,
                url: toolUrl,
                tags: fTags.value.split(',').map(function(s) { return s.trim(); }).filter(Boolean),
                is_paid: fPro.checked
            };
            var res = state.editingId
                ? await sb.from('tools').update(row).eq('id', state.editingId)
                : await sb.from('tools').insert(row);
            if (res.error) {
                fErr.textContent = res.error.message;
                fErr.style.display = 'block';
                return;
            }
            closeModal();
            try { localStorage.removeItem(PROMPTS_CACHE_KEY); } catch (e) {} state.prompts = []; loadPrompts();
        });

        /* ---- auth-aware nav + admin ---- */
        function renderNav() {
            if (!navAuth) return;
            var drawerAuth = document.getElementById('drawerAuth');
            if (!state.user) {
                navAuth.style.display = '';
                navAuth.innerHTML = '<a class="btn solid" href="signup.html?next=tools.html">Start free</a>';
                if (drawerAuth) drawerAuth.innerHTML = '<a class="btn solid" href="signup.html?next=tools.html">Start free</a>';
                return;
            }
            navAuth.style.display = '';
            navAuth.innerHTML = '<button class="btn solid" type="button" id="navLogout">Logout</button>';
            document.getElementById('navLogout').addEventListener('click', async function() { await sb.auth.signOut(); location.reload(); });
            if (drawerAuth) {
                drawerAuth.innerHTML = '<button class="btn solid" type="button" id="drawerLogout" style="width:100%;">Logout</button>';
                document.getElementById('drawerLogout').addEventListener('click', async function() {
                    await sb.auth.signOut();
                    location.reload();
                });
            }
        }

        async function refreshAuth() {
            var res = await sb.auth.getSession();
            var session = res.data && res.data.session;
            state.user = session ? session.user : null;
            state.isAdmin = false;
            if (state.user) {
                var pr = await sb.from('profiles').select('is_admin').eq('id', state.user.id).single();
                if (pr.data) state.isAdmin = !!pr.data.is_admin;
            }
            if (adminBar) adminBar.style.display = state.isAdmin ? '' : 'none';
            try { var pf = localStorage.getItem('ca_pending_fav'); if (pf && state.user) { localStorage.removeItem('ca_pending_fav'); var f0 = getFavs(); if (f0.indexOf(String(pf)) < 0) { f0.push(String(pf)); try { localStorage.setItem('ca_favs', JSON.stringify(f0)); } catch (e) {} } } } catch (e) {}
            renderNav();
            render();
        }

        // run prompts and auth in parallel — don't block one on the other
        loadPrompts();
        if (getSession()) initAuth();
        else renderNav();
    })();
    </script>
    <!-- redeploy -->
</body>

</html>
