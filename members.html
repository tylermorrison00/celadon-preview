<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - Creators Automation</title>
    <link rel="stylesheet" href="templatemo-633-celadon-style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #themeToggle, #colorTheme { display: none !important; }
        .members-wrap { max-width: 900px; margin: 40px auto; padding: 0 16px; }
        .member-row { display: flex; justify-content: space-between; align-items: center; background: #fff; border-radius: 14px; padding: 14px 18px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .member-row .email { font-weight: 600; color: #0E3A2E; }
        .member-row .plan { font-size: .85rem; color: #6b7a74; }
        .plan-drop { position: relative; display: inline-block; }
        .plan-btn { cursor: pointer; }
        .plan-list { position: absolute; right: 0; top: 100%; margin-top: 4px; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); min-width: 140px; z-index: 100; overflow: hidden; }
        .plan-opt { display: block; width: 100%; text-align: left; padding: 10px 16px; border: none; background: none; font-size: .85rem; color: #0E3A2E; cursor: pointer; }
        .plan-opt:hover { background: #e8f5f0; }
    </style>
</head>
<body>
    <div id="app">
        <!-- header removed per user request -->
        <main class="members-wrap">
            <a class="btn" href="index.html" style="margin-bottom:20px;display:inline-block;">&larr; Back</a>

            <div id="membersList"><p style="color:#6b7a74;">Loading...</p></div>
        </main>
    </div>
    <script>
        var API = 'https://vfyuebkdkxhdrlduqxng.supabase.co';
        var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmeXVlYmtka3hoZHJsZHVxeG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTI1NDQsImV4cCI6MjEwNjc2ODU0NH0.RY-VU33zwySGKmPH34pHs72HaxRt9yi4lAhHO9xn7_4';
        var sb = window.supabase.createClient(API, ANON);
        
        async function init() {
            var s = await sb.auth.getSession();
            var user = s.data && s.data.session ? s.data.session.user : null;
            if (!user) { location.href = 'signup.html?next=members.html'; return; }
            
            // Check admin via profiles.is_admin
            var pr = await sb.from('profiles').select('is_admin').eq('id', user.id).single();
            var isAdmin = pr.data && !!pr.data.is_admin;
            if (!isAdmin) { location.href = 'index.html'; return; }
            
            // admin verified, no header shown
            
            // Load members from profiles
            try {
                var res = await sb.from('profiles').select('id, email, plan, created_at').order('created_at', { ascending: false }).limit(100);
                if (res.error) throw res.error;
                var list = document.getElementById('membersList');
                if (!res.data || !res.data.length) {
                    list.innerHTML = '<p style="color:#6b7a74;">No members yet.</p>';
                    return;
                }
                list.innerHTML = res.data.map(function(m) {
                    var plan = (m.plan || 'free').toLowerCase();
                    var planLabel = plan === 'pro' ? 'Pro' : plan === 'basic' ? 'Basic' : 'Free';
                    var btnClass = plan === 'free' ? 'btn plan-btn' : 'btn solid plan-btn';
                    return '<div class="member-row">' +
                        '<span class="email">' + (m.email || '-') + '</span>' +
                        '<div class="plan-drop">' +
                        '<button class="' + btnClass + '" data-id="' + m.id + '">' + planLabel + ' &#9662;</button>' +
                        '<div class="plan-list" hidden>' +
                        '<button class="plan-opt" data-plan="free" data-id="' + m.id + '">Free</button>' +
                        '<button class="plan-opt" data-plan="basic" data-id="' + m.id + '">Basic</button>' +
                        '<button class="plan-opt" data-plan="pro" data-id="' + m.id + '">Pro</button>' +
                        '<button class="plan-opt" data-plan="pro_always" data-id="' + m.id + '">Pro (Always)</button>' +
                        '</div></div></div>';
                }).join('');
                
                // Dropdown toggle
                list.querySelectorAll('.plan-btn').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var list2 = btn.parentElement.querySelector('.plan-list');
                        var wasHidden = list2.hidden;
                        list.querySelectorAll('.plan-list').forEach(function(l) { l.hidden = true; });
                        list2.hidden = !wasHidden;
                    });
                });
                document.addEventListener('click', function() {
                    list.querySelectorAll('.plan-list').forEach(function(l) { l.hidden = true; });
                });
                
                // Plan change handlers
                list.querySelectorAll('.plan-opt').forEach(function(opt) {
                    opt.addEventListener('click', async function(e) {
                        e.stopPropagation();
                        var memberId = opt.getAttribute('data-id');
                        var planType = opt.getAttribute('data-plan');
                        opt.textContent = '...';
                        try {
                            var update = {};
                            var now = new Date();
                            if (planType === 'free') {
                                update = { plan: 'free', plan_expires_at: null };
                            } else if (planType === 'basic') {
                                var exp = new Date(now.getTime() + 30*24*60*60*1000);
                                update = { plan: 'basic', plan_expires_at: exp.toISOString() };
                            } else if (planType === 'pro') {
                                var exp2 = new Date(now.getTime() + 30*24*60*60*1000);
                                update = { plan: 'pro', plan_expires_at: exp2.toISOString() };
                            } else if (planType === 'pro_always') {
                                update = { plan: 'pro', plan_expires_at: null };
                            }
                            var ures = await sb.from('profiles').update(update).eq('id', memberId);
                            if (ures.error) throw ures.error;
                            init(); // reload
                        } catch (err) {
                            opt.textContent = planType;
                        }
                    });
                });
            } catch (e) {
                document.getElementById('membersList').innerHTML = '<p style="color:#c0392b;">Could not load members.</p>';
            }
        }
        init();
    </script>
</body>
</html>
