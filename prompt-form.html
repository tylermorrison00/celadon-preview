    body::before, body.dark-mode::before { display: none !important; }

    .pwrap { max-width: 700px; margin: 0 auto; padding: 96px 18px 60px; }
    .pform-title { font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 800; letter-spacing: -.02em; margin: 22px 0 20px; color: #0E3A2E; line-height: 1.2; }
    .pform .field, .pform textarea, .pform select { width: 100%; margin-bottom: 14px; font-family: inherit; box-sizing: border-box; }
    .pform select option { background: #fff; color: #0E3A2E; font-weight: 600; padding: 10px; }
    .pform select option:hover, .pform select option:checked { background: linear-gradient(180deg, #7DE3A8, #5BC8A0); color: #0E3A2E; }
    .pform textarea { min-height: 200px; resize: vertical; border-radius: 18px; scrollbar-width: none; -ms-overflow-style: none; }
    .pform textarea::-webkit-scrollbar { display: none; }
    .pform label.pro { display: flex; align-items: center; gap: 8px; font-size: .95rem; margin-bottom: 14px; color: #0E3A2E; font-weight: 600; cursor: pointer; }
    .pform label.pro input { width: 18px; height: 18px; accent-color: #0E3A2E; cursor: pointer; }
    .pform .flabel { display: block; font-size: .85rem; font-weight: 700; color: #0E3A2E; margin-bottom: 6px; }
    .pform .row { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    .pform .row .btn, .pform .row .btn-cancel { margin: 0; vertical-align: middle; line-height: 1.2; }
    .pform .btn-cancel { font-size: .95rem; padding: 13px 28px; border-radius: 999px; border: none; background-image: var(--gloss); cursor: pointer; font-weight: 600; color: var(--ink-2); text-decoration: none; display: inline-block; box-shadow: var(--lift), var(--lip); transition: transform .15s ease, box-shadow .15s ease; }
    .pform .btn-cancel:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(14,58,46,.15), var(--lip); }
    .auth-err { display: none; color: #b3261e; font-size: .9rem; margin: 0 0 12px; }
    .cdrop { position: relative; margin-bottom: 14px; }
    .cdrop-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 24px; border: 0; border-radius: 99px; background: var(--sunk); box-shadow: var(--well); outline: none; font-size: .95rem; font-family: inherit; color: #22312c; cursor: pointer; box-sizing: border-box; }
    .cdrop-btn .carr { font-size: .8rem; }
    .cdrop-list { position: absolute; top: 100%; left: 0; right: 0; margin-top: 6px; background: #fff; border-radius: 18px; box-shadow: 0 12px 32px rgba(14,58,46,.15); overflow: hidden; z-index: 50; }
    .cdrop-opt { width: 100%; padding: 13px 20px; border: none; background: #fff; text-align: left; font-weight: 600; color: #0E3A2E; cursor: pointer; font-size: .95rem; font-family: inherit; }
    .cdrop-opt:hover { background: linear-gradient(180deg, #7DE3A8, #5BC8A0); }
    #tagPills .tpill { padding: 6px 14px; font-size: .75rem; border-radius: 999px; background: var(--gloss); border: none; cursor: pointer; font-weight: 500; color: var(--ink-2); box-shadow: var(--lift), var(--lip); display: inline-flex; align-items: center; gap: 6px; }
    #tagPills .tpill .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    #tagPills .tpill.sel { background-image: var(--gloss-jade); color: #0E3A2E; font-weight: 700; }
    .ploading { text-align: center; padding: 60px 20px; color: #6b7a74; font-size: 1rem; }
</style>

    <script>
    /* Prompt Add/Edit page — admin only, dedicated page instead of modal */
    function normTitle(s) { return String(s || '').replace(/[\u{1D400}-\u{1D7FF}]/gu, function(ch) { var cp = ch.codePointAt(0); if (cp >= 0x1D400 && cp <= 0x1D419) return String.fromCharCode(65 + cp - 0x1D400); if (cp >= 0x1D41A && cp <= 0x1D433) return String.fromCharCode(97 + cp - 0x1D41A); if (cp >= 0x1D7CE && cp <= 0x1D7D7) return String.fromCharCode(48 + cp - 0x1D7CE); if (cp >= 0x1D5D4 && cp <= 0x1D5ED) return String.fromCharCode(65 + cp - 0x1D5D4); if (cp >= 0x1D5EE && cp <= 0x1D607) return String.fromCharCode(97 + cp - 0x1D5EE); if (cp >= 0x1D7E2 && cp <= 0x1D7EB) return String.fromCharCode(48 + cp - 0x1D7E2); return ch; }); }
    function press() {
        try {
            var AC = window.AudioContext || window.webkitAudioContext;
            var ctx = new AC();
            var t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(520, t);
            o.frequency.exponentialRampToValueAtTime(390, t + 0.13);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.36, t + 0.012);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
            o.connect(g); g.connect(ctx.destination);
            o.start(t); o.stop(t + 0.2);
        } catch (e) {}
    }
    (function() {
        var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmeXVlYmtka3hoZHJsZHVxeG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTI1NDQsImV4cCI6MjEwNjc2ODU0NH0.RY-VU33zwySGKmPH34pHs72HaxRt9yi4lAhHO9xn7_4';
        var API = 'https://vfyuebkdkxhdrlduqxng.supabase.co';
        var editId = new URLSearchParams(location.search).get('id');
        var TABLE = new URLSearchParams(location.search).get('table') || 'prompts';
        var singular = TABLE === 'niches' ? 'niche' : (TABLE === 'tools' ? 'tool' : 'prompt');
        var IS_TOOLS = TABLE === 'tools';
        var IS_NICHES = TABLE === 'niches';
        var BACK_PAGE = TABLE === 'tools' ? 'tools.html' : (TABLE === 'niches' ? 'niches.html' : 'index.html');
        var BACK_LABEL = TABLE === 'tools' ? 'Back to all tools' : (TABLE === 'niches' ? 'Back to all niches' : 'Back to all prompts');
        var sb = null;
        var fTitle = document.getElementById('pfTitle');
        var fCat = document.getElementById('pfCategory');
        var fText = document.getElementById('pfText');
        var fDetail = document.getElementById('pfDetail');
        var fTags = document.getElementById('pfTags');
        var fMedia = document.getElementById('pfMedia');
        var fPro = document.getElementById('pfPro');
        var fTrend = document.getElementById('pfTrend');
        var tagPills = document.getElementById('tagPills');
        var imgFile = document.getElementById('imgFile');
        var imgName = document.getElementById('imgName');
        var uploadedUrl = '';
        var fErr = document.getElementById('pfErr');
        var formTitle = document.getElementById('formTitle');
        var formWrap = document.getElementById('formWrap');
        var formLoading = document.getElementById('formLoading');

        function showErr(msg) {
            fErr.textContent = msg;
            fErr.style.display = 'block';
        }
        function hideErr() {
            fErr.textContent = '';
            fErr.style.display = 'none';
        }
        function showForm() {
            formLoading.style.display = 'none';
            formWrap.style.display = 'block';
        }
        function setupToolsMode() {
            if (!IS_TOOLS) return;
            // Update labels
            var lblTitle = document.getElementById('lblTitle'); if (lblTitle) lblTitle.textContent = 'Tool name';
            var lblText = document.getElementById('lblText'); if (lblText) lblText.textContent = 'Description';
            var lblPro = document.getElementById('lblPro');
            if (lblPro) lblPro.innerHTML = '<input type="checkbox" id="pfPro"> Paid tool';
            // Show URL field, hide category/media/trending
            var urlWrap = document.getElementById('urlWrap'); if (urlWrap) urlWrap.style.display = 'block';
            var catWrap = document.getElementById('catWrap'); if (catWrap) catWrap.style.display = 'none';
            var mediaWrap = document.getElementById('mediaWrap'); if (mediaWrap) mediaWrap.style.display = 'none';
            var lblTrend = document.getElementById('lblTrend'); if (lblTrend) lblTrend.style.display = 'none';
            // Update placeholders
            var fTitle = document.getElementById('pfTitle'); if (fTitle) fTitle.placeholder = 'Tool name';
            var fText = document.getElementById('pfText'); if (fText) fText.placeholder = 'Description...';
            // Update back/cancel links
            var backBtn = document.getElementById('backBtn');
            if (backBtn) { backBtn.href = BACK_PAGE; backBtn.innerHTML = '&larr; ' + BACK_LABEL; }
            var cancelBtn = document.querySelector('.btn-cancel');
            if (cancelBtn) cancelBtn.href = BACK_PAGE;
            var pfSave = document.getElementById('pfSave');
            if (pfSave) pfSave.textContent = 'Save tool';
        }
        function setupNichesMode() {
            if (!IS_NICHES) return;
            // Update labels: "Prompt text" -> "Why it works", show "What's inside"
            var lblText = document.getElementById('lblText'); if (lblText) lblText.textContent = 'Why it works';
            if (fText) { fText.placeholder = 'Why it works...'; fText.setAttribute('aria-label', 'Why it works'); }
            var detailWrap = document.getElementById('detailWrap'); if (detailWrap) detailWrap.style.display = 'block';
            // Update back/cancel links
            var backBtn = document.getElementById('backBtn');
            if (backBtn) { backBtn.href = BACK_PAGE; backBtn.innerHTML = '&larr; ' + BACK_LABEL; }
            var cancelBtn = document.querySelector('.btn-cancel');
            if (cancelBtn) cancelBtn.href = BACK_PAGE;
            var pfSave = document.getElementById('pfSave');
            if (pfSave) pfSave.textContent = 'Save niche';
        }
        // hover sound (laptop only)
        function tick() { try { if (window.matchMedia('(hover: hover)').matches) press(); } catch (e) {} }
        // load existing tags as pills
        var tagColors = ['#7CCFB0','#A8C5E8','#E8734A','#F0C980','#8FD6C8','#B8A9E8','#E8A0A0','#A0D6E8'];
        async function loadTagPills() {
            try {
                var r = await sb.from(TABLE).select('tags');
                var counts = {};
                var orig = {};
                (r.data || []).forEach(function(p) { (p.tags || []).forEach(function(t) { var k = String(t).toLowerCase(); counts[k] = (counts[k] || 0) + 1; if (!orig[k]) orig[k] = t; }); });
                var tags = Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];}).slice(0,20);
                var cur = fTags.value.split(',').map(function(s){return s.trim().toLowerCase();}).filter(Boolean);
                tagPills.innerHTML = '';
                tags.forEach(function(k, i) {
                    var c = tagColors[i % tagColors.length];
                    var b = document.createElement('button');
                    b.type = 'button'; b.className = 'tpill' + (cur.indexOf(k) >= 0 ? ' sel' : '');
                    var tc = orig[k].replace(/\w\S*/g, function(w){return w.charAt(0).toUpperCase()+w.slice(1);});
                    b.innerHTML = '<span class="dot" style="background:' + c + ';"></span>' + tc;
                    (function(btn, tag) {
                        btn.onclick = function() { press(); toggleTagPill(btn, tag); };
                        btn.onmouseenter = tick;
                    })(b, orig[k]);
                    tagPills.appendChild(b);
                });
            } catch (e) {}
        }
        function toggleTagPill(btn, tag) {
            var cur = fTags.value.split(',').map(function(s){return s.trim();}).filter(Boolean);
            var low = cur.map(function(s){return s.toLowerCase();});
            var i = low.indexOf(String(tag).toLowerCase());
            if (i >= 0) { cur.splice(i, 1); btn.classList.remove('sel'); }
            else { cur.push(tag); btn.classList.add('sel'); }
            fTags.value = cur.join(', ');
        }
        // custom category dropdown
        var catBtn = document.getElementById('catBtn');
        var catList = document.getElementById('catList');
        var catLabel = document.getElementById('catLabel');
        var pfCatHidden = document.getElementById('pfCategory');
        if (catBtn) {
            catBtn.addEventListener('click', function(e) { e.stopPropagation(); press(); catList.style.display = catList.style.display === 'none' ? 'block' : 'none'; });
            catBtn.addEventListener('mouseenter', tick);
            document.querySelectorAll('.cdrop-opt').forEach(function(o) {
                o.addEventListener('mouseenter', tick);
                o.addEventListener('click', function(e) { e.stopPropagation(); press(); pfCatHidden.value = o.getAttribute('data-val'); catLabel.textContent = o.textContent; catList.style.display = 'none'; });
            });
            document.addEventListener('click', function() { catList.style.display = 'none'; });
        }
        // image upload
        document.getElementById('imgUploadBtn').addEventListener('click', function() { press(); imgFile.click(); });
        imgFile.addEventListener('change', async function() {
            var f = imgFile.files[0]; if (!f) return;
            imgName.textContent = 'Uploading...';
            try {
                var name = Date.now() + '_' + f.name.replace(/[^a-zA-Z0-9.]/g, '_');
                var up = await sb.storage.from('prompt-media').upload(name, f);
                if (up.error) throw up.error;
                var pub = sb.storage.from('prompt-media').getPublicUrl(name);
                uploadedUrl = pub.data.publicUrl;
                document.getElementById('pfMedia').value = uploadedUrl;
                imgName.textContent = f.name;
            } catch (e) { imgName.textContent = 'Upload failed'; }
        });

        async function init() {
            if (!window.supabase || !window.supabase.createClient) {
                location.href = 'index.html';
                return;
            }
            sb = window.supabase.createClient(API, ANON);
            // admin check
            var s = await sb.auth.getSession();
            var user = s.data && s.data.session ? s.data.session.user : null;
            if (!user) { location.href = 'index.html'; return; }
            var pr = await sb.from('profiles').select('is_admin').eq('id', user.id).single();
            if (!pr.data || !pr.data.is_admin) { location.href = 'index.html'; return; }
            // nav auth state (logout)
            var navAuth = document.getElementById('navAuth');
            var drawerAuth = document.getElementById('drawerAuth');
            if (navAuth) {
                navAuth.style.display = '';
                navAuth.innerHTML = '<button class="btn solid" type="button" id="navLogout">Logout</button>';
                document.getElementById('navLogout').addEventListener('click', async function() { await sb.auth.signOut(); location.href = 'index.html'; });
            }
            if (drawerAuth) {
                drawerAuth.innerHTML = '<button class="btn solid" type="button" id="drawerLogout" style="width:100%;text-align:center;">Logout</button>';
                document.getElementById('drawerLogout').addEventListener('click', async function() { await sb.auth.signOut(); location.href = 'index.html'; });
            }
            if (!editId) { formTitle.textContent = 'Add new ' + singular; document.title = 'Add ' + singular + ' — Creators Automation'; }
            // edit mode: load existing prompt
            if (editId) {
                formTitle.textContent = 'Edit ' + singular;
                document.title = 'Edit ' + singular + ' — Creators Automation';
                var res = await sb.from(TABLE).select('*').eq('id', editId).single();
                if (res.error || !res.data) {
                    showErr('Not found.');
                    showForm();
                    return;
                }
                var p = res.data;
                if (IS_TOOLS) {
                    fTitle.value = p.name || '';
                    fText.value = p.description || '';
                    fTags.value = (p.tags || []).join(', ');
                    var pfUrl = document.getElementById('pfUrl'); if (pfUrl) pfUrl.value = p.url || '';
                    var pfPro2 = document.getElementById('pfPro'); if (pfPro2) pfPro2.checked = !!p.is_paid;
                } else if (IS_NICHES) {
                    fTitle.value = p.title || '';
                    fCat.value = p.category || 'tiktok';
                    var cl = document.getElementById('catLabel'); if (cl) cl.textContent = (p.category === 'youtube') ? 'YouTube' : 'TikTok';
                    fText.value = p.why_text || '';
                    if (fDetail) fDetail.value = p.detail_text || '';
                    fTags.value = (p.tags || []).join(', ');
                    fMedia.value = p.media_url || '';
                    fPro.checked = !!p.is_pro;
                    if (fTrend) fTrend.checked = !!p.is_trending;
                    if (p.media_url) { uploadedUrl = p.media_url; imgName.textContent = 'Image loaded'; }
                } else {
                    fTitle.value = p.title || '';
                    fCat.value = p.category || 'tiktok';
                    var cl = document.getElementById('catLabel'); if (cl) cl.textContent = (p.category === 'youtube') ? 'YouTube' : 'TikTok';
                    fText.value = p.prompt_text || '';
                    fTags.value = (p.tags || []).join(', ');
                    fMedia.value = p.media_url || '';
                    fPro.checked = !!p.is_pro;
                    if (fTrend) fTrend.checked = !!p.is_trending;
                    if (p.media_url) { uploadedUrl = p.media_url; imgName.textContent = 'Image loaded'; }
                }
            }
            setupToolsMode();
            setupNichesMode();
            loadTagPills();
            // hover sounds for buttons (laptop only)
            document.querySelectorAll('.pform .btn, .pform .tpill, #imgUploadBtn, #backBtn, .pform .btn-cancel').forEach(function(b) { b.addEventListener('mouseenter', tick); });
            showForm();
        }

        document.getElementById('promptForm').addEventListener('submit', async function() {
            press();
            hideErr();
            var btn = document.getElementById('pfSave');
            var row;
            if (IS_TOOLS) {
                var tName = normTitle(fTitle.value.trim());
                var tUrl = (document.getElementById('pfUrl').value || '').trim();
                var tDesc = fText.value.trim();
                if (!tName || !tUrl) {
                    showErr('Tool name and URL are required.');
                    return;
                }
                row = {
                    name: tName,
                    description: tDesc || null,
                    url: tUrl,
                    tags: fTags.value.split(',').map(function(s) { return s.trim(); }).filter(Boolean),
                    is_paid: document.getElementById('pfPro').checked
                };
                btn.disabled = true;
                btn.textContent = 'Saving...';
            } else if (IS_NICHES) {
                var title = normTitle(fTitle.value.trim());
                var why = fText.value.trim();
                var detail = fDetail ? fDetail.value.trim() : '';
                if (!title || !why) {
                    showErr('Title and "Why it works" are required.');
                    return;
                }
                var mu = (uploadedUrl || document.getElementById('pfMedia').value || '').trim();
                row = {
                    title: title,
                    category: fCat.value,
                    why_text: why,
                    detail_text: detail || null,
                    tags: fTags.value.split(',').map(function(s) { return s.trim(); }).filter(Boolean),
                    media_url: mu || null,
                    media_type: mu ? 'image' : null,
                    is_pro: fPro.checked,
                    is_trending: fTrend.checked
                };
                btn.disabled = true;
                btn.textContent = 'Saving...';
            } else {
                var title = normTitle(fTitle.value.trim());
                var text = fText.value.trim();
                if (!title || !text) {
                    showErr('Title and prompt text are required.');
                    return;
                }
                var mu = (uploadedUrl || document.getElementById('pfMedia').value || '').trim();
                row = {
                    title: title,
                    category: fCat.value,
                    prompt_text: text,
                    tags: fTags.value.split(',').map(function(s) { return s.trim(); }).filter(Boolean),
                    media_url: mu || null,
                    media_type: mu ? 'image' : null,
                    is_pro: fPro.checked,
                    is_trending: fTrend.checked
                };
                btn.disabled = true;
                btn.textContent = 'Saving...';
            }
            var res = editId
                ? await sb.from(TABLE).update(row).eq('id', editId)
                : await sb.from(TABLE).insert(row);
            if (res.error) {
                showErr(res.error.message);
                btn.disabled = false;
                btn.textContent = IS_TOOLS ? 'Save tool' : (IS_NICHES ? 'Save niche' : 'Save prompt');
                return;
            }
            location.href = BACK_PAGE;
        });

        init();
    })();
    </script>
</body>
</html>
